<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Sets the theme before the page paints, so there is no white flash in dark mode -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (!theme) {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="page">

    <!-- HEADER -->
    <div class="header">
      <div>
        <h1>Attendance Tracker</h1>
        <p id="dateLabel"></p>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark mode" title="Switch theme">
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <!-- DATE PICKER -->
    <div class="datebar">
      <button class="icon-btn" id="prevDay" aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <input type="date" id="dateInput" aria-label="Choose date">
      <button class="icon-btn" id="nextDay" aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="btn" id="todayBtn">Today</button>
    </div>

    <!-- DASHBOARD CARDS -->
    <div class="stats">
      <div class="card stat total">
        <div class="label"><span class="dot"></span>Students</div>
        <div class="number" id="statTotal">0</div>
        <div class="sub" id="statUnmarked"></div>
      </div>
      <div class="card stat present">
        <div class="label"><span class="dot"></span>Present</div>
        <div class="number" id="statPresent">0</div>
        <div class="sub"></div>
      </div>
      <div class="card stat absent">
        <div class="label"><span class="dot"></span>Absent</div>
        <div class="number" id="statAbsent">0</div>
        <div class="sub"></div>
      </div>
      <div class="card stat late">
        <div class="label"><span class="dot"></span>Late</div>
        <div class="number" id="statLate">0</div>
        <div class="sub"></div>
      </div>
    </div>

    <!-- ADD STUDENT + SEARCH -->
    <div class="toolbar">
      <div class="field">
        <input type="text" id="nameInput" placeholder="New student name" maxlength="50" aria-label="New student name">
        <button class="btn primary" id="addBtn">Add</button>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search students" aria-label="Search students">
      </div>
    </div>

    <!-- STUDENT LIST -->
    <div class="list-head">
      <h2>Students</h2>
      <a class="btn" href="/export" download>
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        Export CSV
      </a>
    </div>
    <div id="list"></div>
  </div>

  <!-- DELETE CONFIRMATION -->
  <dialog id="confirmDialog">
    <h3>Delete student?</h3>
    <p id="confirmText"></p>
    <div class="dialog-actions">
      <button class="btn" id="cancelDelete">Cancel</button>
      <button class="btn danger" id="confirmDelete">Delete</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
